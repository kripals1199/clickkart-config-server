# docker/docker-compose.yml
services:
  config-server:
    build:
      context: ../
      dockerfile: Dockerfile
    image: clickkart/config-server:1.0.0
    container_name: clickkart-config-server
    ports:
      - "${SERVER_PORT:-8888}:${SERVER_PORT:-8888}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8888}
      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME:-localhost}
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-dev-only-secret-change-me}
      EUREKA_SERVER_HOST: ${EUREKA_SERVER_HOST:-eureka-server}
      EUREKA_SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:-dev-only-secret-change-me}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

networks:
  clickkart-net:
    external: true
    name: clickkart-net
