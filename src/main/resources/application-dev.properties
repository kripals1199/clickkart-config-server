# src/main/resources/application-dev.properties
server.port=${SERVER_PORT:8888}

eureka.client.enabled=true
eureka.instance.hostname=${CONFIG_SERVER_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME:admin}:${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}@${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/


spring.security.user.name=${CONFIG_SERVER_USERNAME:admin}
# dev-only fallback secret - never rely on this default outside a local machine
spring.security.user.password=${CONFIG_SERVER_PASSWORD:dev-only-secret-change-me}

management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.level.org.springframework.cloud.config=DEBUG
