# src/main/resources/application-prod.properties
server.port=${SERVER_PORT:8888}

eureka.client.enabled=true
eureka.instance.hostname=${CONFIG_SERVER_HOSTNAME}
eureka.instance.prefer-ip-address=true
# no fallback host: prod topology must be set deliberately, never guessed
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME}:${EUREKA_DASHBOARD_PASSWORD}@${EUREKA_SERVER_HOST}:${EUREKA_SERVER_PORT:8761}/eureka/

spring.security.user.name=${CONFIG_SERVER_USERNAME}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.timeout=15

management.endpoint.health.show-details=when-authorized

logging.level.root=WARN
logging.level.com.clickkart=WARN
logging.structured.format.console=ecs
