# src/main/resources/application-qa.properties
server.port=${SERVER_PORT:8888}

eureka.client.enabled=true
eureka.instance.hostname=${CONFIG_SERVER_HOSTNAME:config-server-qa}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME}:${EUREKA_DASHBOARD_PASSWORD}@${EUREKA_SERVER_HOST:eureka-server-qa}:${EUREKA_SERVER_PORT:8761}/eureka/

spring.security.user.name=${CONFIG_SERVER_USERNAME}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.com.clickkart=INFO
logging.level.org.springframework.cloud.config=WARN
