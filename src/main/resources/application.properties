# src/main/resources/application.properties
spring.application.name=clickkart-config-server
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Backing git repo for every OTHER service's config. Explicit search-paths/default-label
# per ClickKart Section 2a.2 - never left to Spring Cloud defaults.
spring.cloud.config.server.git.uri=https://github.com/kripals1199/clickkart-config-repository
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=.
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.timeout=10

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.probes.enabled=true
management.info.env.enabled=true

info.service=clickkart-config-server
