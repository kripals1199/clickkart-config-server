# src/main/resources/application-test.properties
server.port=${SERVER_PORT:8888}

eureka.client.enabled=true
eureka.instance.hostname=${CONFIG_SERVER_HOSTNAME:config-server-test}
eureka.instance.prefer-ip-address=true
# no default: CI must inject these, startup fails fast otherwise
eureka.client.service-url.defaultZone=http://${EUREKA_DASHBOARD_USERNAME}:${EUREKA_DASHBOARD_PASSWORD}@${EUREKA_SERVER_HOST:eureka-server-test}:${EUREKA_SERVER_PORT:8761}/eureka/

spring.security.user.name=${CONFIG_SERVER_USERNAME}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

logging.level.root=INFO
logging.level.com.clickkart=INFO
logging.level.org.springframework.cloud.config=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
